<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background circle with soft border -->
  <circle cx="100" cy="100" r="96" fill="#FCFAF6" stroke="#D8BFA3" stroke-width="4" />
  
  <!-- Stylized artistic portrait background blob -->
  <path d="M 60,110 C 60,70 140,70 140,110 C 140,150 60,150 60,110 Z" fill="#E8C96A" opacity="0.4" />
  
  <!-- Head outline -->
  <circle cx="100" cy="90" r="30" fill="#F7F1E8" stroke="#5B4636" stroke-width="3.5" />
  
  <!-- Hair / Feature - cute stylized hair -->
  <path d="M 70,90 C 70,60 130,60 130,90 C 120,80 80,80 70,90 Z" fill="#5B4636" />
  
  <!-- Shoulders -->
  <path d="M 50,165 C 50,130 150,130 150,165" fill="none" stroke="#5B4636" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Clothes detail (collar) -->
  <path d="M 90,130 L 100,140 L 110,130" fill="none" stroke="#C96B5B" stroke-width="3" stroke-linecap="round" />
  
  <!-- Eyes -->
  <circle cx="90" cy="92" r="3" fill="#5B4636" />
  <circle cx="110" cy="92" r="3" fill="#5B4636" />
  
  <!-- Smiling mouth -->
  <path d="M 93,103 Q 100,108 107,103" fill="none" stroke="#5B4636" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Blush on cheeks -->
  <circle cx="83" cy="98" r="4" fill="#C96B5B" opacity="0.6" />
  <circle cx="117" cy="98" r="4" fill="#C96B5B" opacity="0.6" />
  
  <!-- Sparkles -->
  <path d="M 55,60 L 58,63 L 55,66 L 52,63 Z" fill="#E8C96A" />
  <path d="M 145,70 L 148,73 L 145,76 L 142,73 Z" fill="#E8C96A" />
  <path d="M 150,120 L 152,122 L 150,124 L 148,122 Z" fill="#C96B5B" />
</svg>
